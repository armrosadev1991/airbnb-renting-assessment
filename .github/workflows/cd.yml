name: CD

# Deploy to prod on every push to main, but only after the full CI suite passes on that exact
# commit. GitHub doesn't enforce branch protection on free private repos, so this `needs: ci`
# is the technical control: a direct push to main with broken code is never deployed.
# Deploy only: running the job is a separate, manual step (`just run prod`) because a run
# consumes Free Edition quota.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # never interrupt a deployment half-way

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy_prod:
    name: Deploy to prod
    needs: ci
    runs-on: ubuntu-latest
    environment: prod  # GitHub environment holding the prod secrets (approvals optional)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy bundle
        uses: ./.github/actions/cd
        with:
          target: prod
          databricks_host: ${{ secrets.DATABRICKS_HOST }}
          databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
